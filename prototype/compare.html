<!doctype html>
<!-- PROTOTYPE — throwaway compare harness, issue #42. Real screenshot vs replica, side-by-side or overlay. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>prototype · 对拍</title>
<style>
  body { margin: 0; font: 13px/1.5 -apple-system, "Helvetica Neue", Arial, sans-serif; background: #111; color: #eee; }
  header { position: sticky; top: 0; z-index: 5; display: flex; gap: 10px; align-items: center; padding: 8px 12px; background: #000; flex-wrap: wrap; }
  header button { background: #222; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; }
  header button.on { background: #4f46e5; border-color: #4f46e5; }
  header input { width: 160px; }
  #stage { position: relative; width: 1422px; height: 800px; margin: 12px auto; outline: 1px solid #333; overflow: hidden; background: #18181b; }
  #stage iframe { position: absolute; inset: 0; width: 1422px; height: 800px; border: 0; }
  #stage img.real { position: absolute; left: 0; top: 0; width: 1422px; height: 800px; object-fit: fill; pointer-events: none; }
  .sbs #stage { width: 2860px; display: flex; gap: 16px; overflow: visible; background: none; outline: none; }
  .sbs #stage iframe { position: static; flex: 0 0 1422px; outline: 1px solid #333; }
  .sbs #stage img.real { position: static; flex: 0 0 1422px; outline: 1px solid #333; }
  .sbs #stage .pane-label { position: absolute; }
  label { display: flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<header>
  <span>对拍 #42</span>
  <button data-pair="board-dark" class="on">看板 dark / r5·03</button>
  <button data-pair="board-light">看板 light / r5·02</button>
  <button data-pair="detail-fresh">详情 fresh / r5·05</button>
  <button data-pair="detail-exec">详情 exec / r5·06</button>
  <button data-pair="detail-plan">详情 plan / r3·58</button>
  <button id="mode">mode: overlay</button>
  <label>real opacity <input id="op" type="range" min="0" max="100" value="50"></label>
</header>
<div id="wrap">
  <div id="stage">
    <iframe id="rep" src="board.html?theme=dark"></iframe>
    <img class="real" id="real" alt="real screenshot">
  </div>
</div>
<script>
  const PAIRS = {
    'board-dark':  ['board.html?theme=dark&noharness=1&state=r5',  '../docs/research/assets/r5/03-board-dark-探针卡.png'],
    'board-light': ['board.html?theme=light&noharness=1&state=r5', '../docs/research/assets/r5/02-board-light-探针卡.png'],
    'detail-fresh': ['todo-detail.html?noharness=1&phase=fresh', '../docs/research/assets/r5/05-task-panel-fresh-light.png'],
    'detail-exec': ['todo-detail.html?noharness=1&phase=review', '../docs/research/assets/r5/06-task-panel-executing-r3card-light.png'],
    'detail-plan': ['todo-detail.html?noharness=1&phase=plan', '../docs/research/assets/r3/58-plan-card.png'],
  };
  const rep = document.getElementById('rep'), real = document.getElementById('real');
  const set = (k) => {
    const [r, g] = PAIRS[k];
    rep.src = r; real.src = g;
    document.querySelectorAll('[data-pair]').forEach(b => b.classList.toggle('on', b.dataset.pair === k));
  };
  document.querySelectorAll('[data-pair]').forEach(b => b.onclick = () => set(b.dataset.pair));
  const modeBtn = document.getElementById('mode');
  modeBtn.onclick = () => {
    const sbs = document.getElementById('wrap').classList.toggle('sbs');
    modeBtn.textContent = 'mode: ' + (sbs ? 'side-by-side' : 'overlay');
    real.style.opacity = sbs ? 1 : document.getElementById('op').value / 100;
  };
  document.getElementById('op').oninput = (e) => { real.style.opacity = e.target.value / 100; };
  real.style.opacity = 0.5;
</script>
</body>
</html>
