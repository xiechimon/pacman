<div class="harness">
  <span>PROTOTYPE #42</span>
  <button id="t-dark" class="on">dark</button>
  <button id="t-light">light</button>
</div>
<script>
  const set = (light) => {
    document.documentElement.classList.toggle('light', light);
    document.getElementById('t-dark').classList.toggle('on', !light);
    document.getElementById('t-light').classList.toggle('on', light);
  };
  document.getElementById('t-dark').onclick = () => set(false);
  document.getElementById('t-light').onclick = () => set(true);
  const q = new URLSearchParams(location.search);
  if (q.get('theme') === 'light') set(true);
  if (q.get('noharness')) document.querySelector('.harness').remove();
</script>
