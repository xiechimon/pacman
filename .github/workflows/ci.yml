name: ci

on:
  push:
    branches: [main, 'web/**', 'prototype/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # reads packageManager from package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm exec playwright install chromium --with-deps

      # migration 纪律（01 §6）：drizzle-kit 生成、进 repo、CI 校验 drift——
      # schema 改动未带 migration 再生成 = 红。
      - name: Drizzle migration drift check
        run: |
          pnpm --filter @xiechimon/pacman db:generate
          git add -N apps/server/drizzle
          git diff --exit-code apps/server/drizzle

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (vitest, schema snapshots)
        run: pnpm test

      - name: Lint (biome ci)
        run: pnpm lint

      - name: Parity smoke gate
        run: pnpm parity

      - name: E2E (reject-loop chain, #75 AC3)
        run: pnpm --filter @pacman/web e2e

  # 发布产物冒烟（#264，spec #260 Testing Decisions 失败方式枚举的 CI 守）：
  # 独立 job/runner——不与 check job 的 parity（同写 apps/web/dist）互踩。
  pack-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # reads packageManager from root package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack smoke (main package tarball, bare node)
        run: scripts/pack-smoke.sh
