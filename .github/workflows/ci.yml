name: ci

# push 只留 main 与 prototype/**（#500）。`web/**` 曾在此列，导致每条车道分支
# 每次 push 触发两条同 workflow 的 run：push 一条、pull_request 一条，跑的是
# 同一个 head sha。近 30 条 run 里 5 条 web/** 分支全部 1:1 双跑，且结论会分歧
# ——web/sidebar-head-polish 的 push run 红、pull_request run 绿（m5 存量 flake），
# 把 commit status 钉成 UNSTABLE 并误导归因。
#
# 不用 concurrency 按 sha 去重：push 的 github.sha 与 pull_request 的
# event.pull_request.head.sha 是同一个值，两者落进同一 group，
# cancel-in-progress 会让后注册的那条取消先注册的——谁存活不确定；若存活的是
# push run，PR 页面只剩一条 cancelled，合并闸反而更糊。收敛触发面才是确定解。
#
# 保留 prototype/**：那两个分支（42-pixel-replica / shadcn-visual-tokens）无
# 开 PR，push run 是它们唯一的 CI 来源；摘掉等于零覆盖。web/** 车道一律开 PR，
# 由无条件的 pull_request 触发覆盖（lane/** docs/** 本就不在列，同一口径）。
# 副作用：web/** 分支在「已 push、未开 PR」的窗口内没有 CI——需要早看信号就开
# draft PR，pull_request 对 draft 同样触发。
on:
  push:
    branches: [main, 'prototype/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # reads packageManager from package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # e2e 迁去独立分片 job（#693）后 ffmpeg 随迁；chromium 留在本 job——
      # integration vitest 的四个 e2e 套件（m5-web-e2e 等）在场内起真
      # Chromium（2026-10-03 实测摘掉即红：browserType.launch executable
      # doesn't exist）。「check 不再需要浏览器面」是误判，浏览器面有两层。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm exec playwright install chromium --with-deps

      # migration 纪律（01 §6）：drizzle-kit 生成、进 repo、CI 校验 drift——
      # schema 改动未带 migration 再生成 = 红。
      # 前置护栏：drizzle-kit 撞到 snapshot 链断裂时**只打印、退出码仍 0**，
      # 且不再生成任何迁移——下面这步的 git diff 就恒为空，闸静默失效。
      # db:check 直接校验链不变量把这种情况变成硬失败。
      - name: Drizzle snapshot chain guard
        run: pnpm --filter @xiechimon/pacman db:check

      - name: Drizzle migration drift check
        run: |
          pnpm --filter @xiechimon/pacman db:generate
          git add -N apps/server/drizzle
          git diff --exit-code apps/server/drizzle

      - name: Typecheck
        run: pnpm typecheck

      # 集成栈单独一步（2026-09-30）：它在场内起真 server + 真 daemon +
      # Chromium，与轻 project 同跑时在 2 vCPU runner 上争核假红——实测：同 sha
      # 连跑两次同点同败、纯文档提交也红、本地同一条 10.9s 过。分组清单在根
      # vitest.config.ts（light + integration 精确等于全量，无泄漏）。
      - name: Test (vitest，轻 project)
        run: VITEST_PROJECT_SET=light pnpm test

      - name: Test (vitest，集成栈单独跑)
        run: VITEST_PROJECT_SET=integration pnpm test

      - name: Lint (biome ci)
        run: pnpm lint

  # e2e 全量归 CI（#693 分层职责）：本地开发期只跑受影响面
  # （pnpm --filter @pacman/web e2e:affected），全量唯一执行点在这。
  # 4 分片并行（playwright --shard，按测试精确切分、并集 = 全量 83 spec，
  # 覆盖面不降）：单 shard ≈ setup + fixture build + 1/4 测试量 ≈ 2 分钟，
  # 远小于原 check job 里串行的 223s e2e 步。独立 job/runner 也顺带消掉了
  # 「与 check job 同 runner 互写 apps/web/dist」的约束（token-gate 与
  # webServer 都在各自 runner 的 dist 上工作）。fail-fast 关闭：一个 shard
  # 红不掩盖其余 shard 的结果。
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # reads packageManager from root package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm exec playwright install chromium --with-deps

      # 分隔符的位置是有判据的（#765）：pnpm 把 `--` 原样转给脚本，`e2e -- --shard=…`
      # 于是 playwright 收到一个 `--` 位置参数、`--shard` 根本没进解析——四条分片
      # 各跑全量 688 用例（实测 4m03–5m32/shard），分片形同虚设。去掉 `--`（pnpm
      # 会把脚本名之后的未知 flag 直接转发）后每分片 173/171/…，并集 = 全量。
      - name: E2E (shard ${{ matrix.shard }}/4, #693)
        run: pnpm --filter @pacman/web e2e --shard=${{ matrix.shard }}/4

      # 编译产物闸（#747）：上面的 E2E 步经 webServer fixture-build 已写出
      # apps/web/dist，本步只做 grep 断言，不另付全构建。防的是 #656/#677
      # 的真故障：tw-animate-css 装了、类名写了但没 @import，全族编译成空。
      - name: CSS mechanism gate (#747)
        run: node scripts/css-mechanism-gate.mjs

  # 分片聚合闸（#693）：分支保护的 required contexts 不编码 matrix 基数——
  # 名单写死 e2e (1..4) 的话，将来分片数一调，名单就静默失配（新增分片不
  # 阻塞合并 = 覆盖面实际下降）。本 job 名固定 e2e-gate、needs 全部分片，
  # 保护名单只引它；分片数调整不再触碰仓库设置。
  #
  # `if: always()` 与那句显式判定都不是可选装饰（#762）：只写 `needs` 时，
  # 任一 shard 失败会让本 job **整个 skip**，而分支保护对 `skipped` 与
  # `successful` / `neutral` 同等放行（GitHub 文档 about-protected-branches
  # 「Require status checks before merging」）——闸恰好在唯一需要它的时刻是
  # 开的。always() 保证它永远上报，再按 `needs.e2e.result` 显式判定：只有全
  # 绿放行，failure / cancelled / skipped 一律失败（fail-closed）。将来若给
  # e2e 加 paths 过滤让整层跳过，会在这里响亮地红，而不是静默丢掉覆盖面。
  e2e-gate:
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate e2e shards
        run: |
          echo "e2e result: ${{ needs.e2e.result }}"
          [ "${{ needs.e2e.result }}" = "success" ]

  # 发布产物冒烟（#264，spec #260 Testing Decisions 失败方式枚举的 CI 守）：
  # 独立 job/runner，不与任何 e2e shard 共享 runner（各自写自己的 dist）。
  pack-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # reads packageManager from root package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack smoke (main package tarball, bare node)
        run: scripts/pack-smoke.sh
